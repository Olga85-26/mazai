<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>ЛЮБИМАЯ ГРАФАНА МАЗАЕВОЙ ОЛЕЧКИ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --coffee: #D2B48C;
    }

    /* без градиента, фон однотонный темно-розовый */
    html, body { height: 100%; }
    body {
      margin: 0;
      background-color: #7a1f49;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrap {
      text-align: center;
      padding: 28px;
      border-radius: 16px;
      max-width: 980px;
      width: 92%;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.15);
    }

    /* Название по центру и крупно */
    .title {
      font-size: clamp(38px, 9vw, 96px);
      font-weight: 900;
      color: #f5e2d0;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin: 0 0 14px;
    }

    /* Таймер крупно с эффектом кофейного цвета */
    #display {
      font-family: "Courier New", monospace;
      font-weight: 900;
      font-size: clamp(72px, 14vw, 170px);
      color: var(--coffee);
      letter-spacing: 8px;
      margin: 6px 0 14px;
      text-shadow: 0 6px 0 rgba(0,0,0,0.25);
    }

    /* Быстрый выбор времени под таймером */
    .quick-select {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 0 14px;
    }

    .quick-select button {
      padding: 12px 20px;
      font-size: 20px;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #4f2f23;
      color: #fff;
    }
    .quick-select button:hover { background: #5d3a28; }

    .controls {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 6px;
      padding: 10px;
    }

    label {
      font-size: 18px;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    input[type="number"] {
      width: 110px;
      padding: 12px;
      font-size: 28px;
      border-radius: 8px;
      border: none;
      outline: 2px solid rgba(255,255,255,.4);
      background: rgba(255,255,255,.15);
      color: #fff;
    }

    button {
      padding: 12px 20px;
      font-size: 20px;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #5a4630;
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .hint {
      margin-top: 12px;
      font-size: 13px;
      opacity: .9;
    }
  </style>
</head>
<body>
  <div class="wrap" aria-label="Таймер-Хэллоуин">
    <div class="title">ЛЮБИМАЯ ГРАФАНА МАЗАЕВОЙ ОЛЕЧКИ</div>

    <div id="display" aria-live="polite">00:00</div>

    <div class="quick-select" aria-label="Быстрый выбор времени">
      <button data-mins="1" title="1 минута">1 минута</button>
      <button data-mins="5" title="5 минут">5 минут</button>
      <button data-mins="10" title="10 минут">10 минут</button>
      <button data-mins="15" title="15 минут">15 минут</button>
    </div>

    <div class="controls" aria-label="Управление таймером">
      <label>Минуты:
        <input id="minutes" type="number" min="0" max="999" value="0" />
      </label>
      <label>Секунды:
        <input id="seconds" type="number" min="0" max="59" value="0" />
      </label>
      <button id="startBtn" aria-label="Старт">Старт</button>
      <button id="pauseBtn" disabled aria-label="Пауза">Пауза</button>
      <button id="resetBtn" disabled aria-label="Сброс">Сброс</button>
    </div>

    <div class="hint" style="text-align:center; color:#e7d3b0;">
      Время отображается в формате MM:SS. По окончании звучит мелодия.
    </div>
  </div>

<script>
  let totalSeconds = 0;
  let timerId = null;
  let isRunning = false;
  let audioCtx = null;
  let melodyScheduled = false;

  function pad(n){ return String(n).padStart(2, '0'); }

  function updateDisplay(sec){
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    document.getElementById('display').textContent = pad(m) + ':' + pad(s);
  }

  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    audioCtx.resume();
  }

  function playTone(freq, duration, when){
    const ctx = audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.value = 0.14;
    osc.start(when);
    gain.gain.setValueAtTime(0.0, when);
    gain.gain.linearRampToValueAtTime(0.14, when + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);
    osc.stop(when + duration + 0.02);
  }

  function playMelody(){
    ensureAudio();
    const melody = [
      { freq: 261.63, dur: 0.25 },
      { freq: 329.63, dur: 0.25 },
      { freq: 392.00, dur: 0.25 },
      { freq: 523.25, dur: 0.25 },
      { freq: 587.33, dur: 0.25 },
      { freq: 659.25, dur: 0.25 },
      { freq: 698.46, dur: 0.25 },
      { freq: 783.99, dur: 0.5 },
      { freq: 523.25, dur: 0.25 },
      { freq: 440.00, dur: 0.25 },
      { freq: 392.00, dur: 0.25 },
      { freq: 329.63, dur: 0.25 },
      { freq: 261.63, dur: 0.5 }
    ];
    let t = audioCtx.currentTime;
    melody.forEach(n => {
      playTone(n.freq, n.dur, t);
      t += n.dur;
    });
  }

  function finishTimer(){
    if (!melodyScheduled){
      melodyScheduled = true;
      playMelody();
    } else {
      melodyScheduled = false;
    }
  }

  // Быстрый выбор времени
  document.querySelectorAll('.quick-select button').forEach(btn => {
    btn.addEventListener('click', () => {
      const mins = parseInt(btn.getAttribute('data-mins'), 10);
      const total = mins * 60;
      totalSeconds = total;
      updateDisplay(totalSeconds);
      document.getElementById('minutes').value = mins;
      document.getElementById('seconds').value = 0;
      // остановить текущий таймер
      if (timerId){
        clearInterval(timerId);
        timerId = null;
        isRunning = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('pauseBtn').disabled = true;
      }
    });
  });

  document.getElementById('startBtn').addEventListener('click', () => {
    const minsFromInput = parseInt(document.getElementById('minutes').value, 10) || 0;
    const secsFromInput = parseInt(document.getElementById('seconds').value, 10) || 0;
    if (minsFromInput < 0 || secsFromInput < 0 || secsFromInput > 59) return;
    totalSeconds = minsFromInput * 60 + secsFromInput;
    updateDisplay(totalSeconds);
    if (timerId) clearInterval(timerId);
    timerId = setInterval(() => {
      if (totalSeconds <= 0){
        clearInterval(timerId);
        timerId = null;
        isRunning = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('pauseBtn').disabled = true;
        document.getElementById('resetBtn').disabled = false;
        finishTimer();
        return;
      }
      totalSeconds--;
      updateDisplay(totalSeconds);
    }, 1000);

    isRunning = true;
    document.getElementById('startBtn').disabled = true;
    document.getElementById('pauseBtn').disabled = false;
    document.getElementById('resetBtn').disabled = false;
  });

  document.getElementById('pauseBtn').addEventListener('click', () => {
    if (timerId){
      clearInterval(timerId);
      timerId = null;
      isRunning = false;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('pauseBtn').disabled = true;
    }
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (timerId) clearInterval(timerId);
    timerId = null;
    isRunning = false;
    totalSeconds = 0;
    document.getElementById('minutes').value = 0;
    document.getElementById('seconds').value = 0;
    updateDisplay(0);
    document.getElementById('startBtn').disabled = false;
    document.getElementById('pauseBtn').disabled = true;
    document.getElementById('resetBtn').disabled = true;
  });

  // Инициализация дисплея
  updateDisplay(0);
</script>
</body>
</html>
