<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>ЛЮБИМАЯ ГРАФАНА ОЛЕЧКИ МАЗАЕВОЙ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      /* кофейно-молочные цвета */
      --coffee: #D2B48C;
      --coffee-dark: #C5A07F;
    }

    /* фоновый стиль: бирюзовый переход */
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background: linear-gradient(135deg, #2b2f34 0%, #0e5a60 60%, #0b7e86 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrap {
      text-align: center;
      padding: 28px;
      border-radius: 16px;
      max-width: 900px;
      width: 92%;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.15);
    }

    /* заголовок по центру крупными буквами */
    .title {
      font-size: clamp(32px, 8vw, 84px);
      font-weight: 900;
      color: #D7C1A4;      /* кофейно-молочный оттенок */
      letter-spacing: 6px;
      text-transform: uppercase;
      margin: 0 0 14px;
      text-shadow: 0 3px 0 rgba(0,0,0,0.25);
    }

    /* крупный таймер */
    #display {
      font-family: "Courier New", monospace;
      font-weight: 900;
      font-size: clamp(64px, 16vw, 170px);
      color: var(--coffee);
      letter-spacing: 8px;
      margin: 6px 0 14px;
      text-shadow: 0 6px 0 rgba(0,0,0,0.25);
    }

    .controls {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 6px;
    }

    label {
      font-size: 18px;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    input[type="number"] {
      width: 110px;
      padding: 12px;
      font-size: 28px;
      border-radius: 8px;
      border: none;
      outline: 2px solid rgba(255,255,255,.4);
      background: rgba(255,255,255,.15);
      color: #fff;
    }

    button {
      padding: 12px 20px;
      font-size: 20px;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #5a4630; /* кофейный оттенок */
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .hint {
      margin-top: 12px;
      font-size: 13px;
      opacity: .9;
    }
  </style>
</head>
<body>
  <div class="wrap" aria-label="Таймер-Хэллоуин">
    <div class="title">ЛЮБИМАЯ ГРАФАНА</div>
    <div id="display" aria-live="polite">10:00</div>

    <div class="controls" aria-label="Управление таймером">
      <label>Минуты:
        <input id="minutes" type="number" min="0" max="999" value="10" />
      </label>
      <button id="startBtn" aria-label="Старт">Старт</button>
      <button id="pauseBtn" disabled aria-label="Пауза">Пауза</button>
      <button id="resetBtn" disabled aria-label="Сброс">Сброс</button>
    </div>

    <div class="hint" style="text-align:center; color:#e7d3b0;">
      Время отображается в формате MM:SS. По окончании звучит мелодия.
    </div>
  </div>

<script>
  let totalSeconds = 0;
  let timerId = null;
  let isRunning = false;
  let audioCtx = null;

  function updateDisplay(sec){
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    const mm = String(m).padStart(2, '0');
    const ss = String(s).padStart(2, '0');
    document.getElementById('display').textContent = mm + ':' + ss;
  }

  function ensureAudio(){
    if (!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    audioCtx.resume();
  }

  function playMelody(){
    ensureAudio();
    // простая мелодия: 4 ноты
    const notes = [
      { freq: 440.0, dur: 0.25 },
      { freq: 493.88, dur: 0.25 },
      { freq: 523.25, dur: 0.25 },
      { freq: 659.25, dur: 0.5 }
    ];
    let t = audioCtx.currentTime;
    notes.forEach(n => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = n.freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.value = 0.14;
      osc.start(t);
      gain.gain.setTargetAtTime(0.0001, t + n.dur, 0.01);
      osc.stop(t + n.dur + 0.05);
      t += n.dur;
    });
  }

  function finishTimer(){
    playMelody();
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    const mins = parseInt(document.getElementById('minutes').value, 10);
    if (isNaN(mins) || mins < 0) return;

    totalSeconds = mins * 60;
    updateDisplay(totalSeconds);

    if (timerId) clearInterval(timerId);
    timerId = setInterval(() => {
      if (totalSeconds <= 0){
        clearInterval(timerId);
        timerId = null;
        isRunning = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('pauseBtn').disabled = true;
        document.getElementById('resetBtn').disabled = false;
        finishTimer();
        return;
      }
      totalSeconds--;
      updateDisplay(totalSeconds);
    }, 1000);

    isRunning = true;
    document.getElementById('startBtn').disabled = true;
    document.getElementById('pauseBtn').disabled = false;
    document.getElementById('resetBtn').disabled = false;
  });

  document.getElementById('pauseBtn').addEventListener('click', () => {
    if (timerId){
      clearInterval(timerId);
      timerId = null;
      isRunning = false;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('pauseBtn').disabled = true;
    }
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (timerId) clearInterval(timerId);
    timerId = null;
    isRunning = false;
    totalSeconds = parseInt(document.getElementById('minutes').value, 10) * 60;
    updateDisplay(totalSeconds);
    document.getElementById('startBtn').disabled = false;
    document.getElementById('pauseBtn').disabled = true;
    document.getElementById('resetBtn').disabled = true;
  });

  // Инициализация дисплея
  updateDisplay(parseInt(document.getElementById('minutes').value, 10) * 60);
</script>
</body>
</html>
