<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="utf-8" />

<title>ЛЮБИМАЯ ГРАФАНА МАЗАЕВОЙ ОЛЕЧКИ</title>

<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>

:root {

/ кофейно-молочные цвета для цифр таймера (при желании можно поменять) /

--coffee: #D2B48C;

--coffee-dark: #C5A07F;

}

/ фон: темно-розовый градиент /

html, body { height: 100%; }

body {

margin: 0;

font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;

background: linear-gradient(135deg, #2b0d1d 0%, #7a1f49 60%, #cf3b79 100%);

color: #fff;

display: flex;

align-items: center;

justify-content: center;

}

.wrap {

text-align: center;

padding: 28px;

border-radius: 16px;

max-width: 980px;

width: 92%;

background: rgba(0,0,0,0.25);

border: 1px solid rgba(255,255,255,0.15);

}

/ заголовок по центру крупными буквами /

.title {

font-size: clamp(38px, 9vw, 86px);

font-weight: 900;

color: #f5e2d0; / кофейно-молочный оттенок /

letter-spacing: 6px;

text-transform: uppercase;

margin: 0 0 14px;

text-shadow: 0 4px 0 rgba(0,0,0,0.25);

}

/ крупный таймер /

#display {

font-family: "Courier New", monospace;

font-weight: 900;

font-size: clamp(64px, 14vw, 170px);

color: #f5e2d0;

letter-spacing: 10px;

margin: 6px 0 14px;

text-shadow: 0 8px 0 rgba(0,0,0,0.25);

}

.controls {

display: inline-flex;

align-items: center;

gap: 14px;

flex-wrap: wrap;

justify-content: center;

margin-top: 6px;

padding: 10px;

}

label {

font-size: 18px;

color: #fff;

display: inline-flex;

align-items: center;

gap: 8px;

}

input[type="number"] {

width: 110px;

padding: 12px;

font-size: 28px;

border-radius: 8px;

border: none;

outline: 2px solid rgba(255,255,255,.4);

background: rgba(255,255,255,.15);

color: #fff;

}

button {

padding: 12px 20px;

font-size: 20px;

font-weight: 700;

border-radius: 8px;

border: none;

cursor: pointer;

background: #5a4630; / кофейный оттенок /

color: #fff;

box-shadow: inset 0 1px 0 rgba(255,255,255,.2);

}

button:disabled {

opacity: .5;

cursor: not-allowed;

}

.hint {

margin-top: 12px;

font-size: 13px;

opacity: .9;

}

</style>

</head>

<body>

<div class="wrap" aria-label="Таймер-Хэллоуин">

<div class="title">ЛЮБИМАЯ ГРАФАНА МАЗАЕВОЙ ОЛЕЧКИ</div>

<div id="display" aria-live="polite">MM:SS</div>

<div class="controls" aria-label="Управление таймером">

<label>Минуты:

<input id="minutes" type="number" min="0" max="999" value="10" />

</label>

<label>Секунды:

<input id="seconds" type="number" min="0" max="59" value="0" />

</label>

<button id="startBtn" aria-label="Старт">Старт</button>

<button id="pauseBtn" disabled aria-label="Пауза">Пауза</button>

<button id="resetBtn" disabled aria-label="Сброс">Сброс</button>

</div>

<div class="hint" style="text-align:center; color:#e7d3b0;">

Время отображается в формате MM:SS. По окончании звучит мелодия.

</div>

</div>

<script>

let totalSeconds = 0;

let timerId = null;

let isRunning = false;

let audioCtx = null;

let melodyScheduled = false;

function pad(n) { return String(n).padStart(2, '0'); }

function updateDisplay(sec){

const m = Math.floor(sec / 60);

const s = sec % 60;

document.getElementById('display').textContent = pad(m) + ':' + pad(s);

}

function ensureAudio(){

if (!audioCtx){

audioCtx = new (window.AudioContext || window.webkitAudioContext)();

}

audioCtx.resume();

}

function playTone(freq, duration, when){

const ctx = audioCtx;

const osc = ctx.createOscillator();

const gain = ctx.createGain();

osc.type = 'sine';

osc.frequency.value = freq;

osc.connect(gain);

gain.connect(ctx.destination);

gain.gain.value = 0.14;

osc.start(when);

// Простая ADSR-обвязка

gain.gain.setValueAtTime(0.0, when);

gain.gain.linearRampToValueAtTime(0.14, when + 0.01);

gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);

osc.stop(when + duration + 0.02);

}

function playMelody(){

ensureAudio();

// Более сложная мелодия (несколько нот подряд)

const melody = [

{ freq: 261.63, dur: 0.25 }, // C4

{ freq: 329.63, dur: 0.25 }, // E4

{ freq: 392.00, dur: 0.25 }, // G4

{ freq: 523.25, dur: 0.25 }, // C5

{ freq: 587.33, dur: 0.25 }, // D5

{ freq: 659.25, dur: 0.25 }, // E5

{ freq: 698.46, dur: 0.25 }, // F5

{ freq: 783.99, dur: 0.5 }, // G5

{ freq: 523.25, dur: 0.25 }, // C5

{ freq: 440.00, dur: 0.25 }, // A4

{ freq: 392.00, dur: 0.25 }, // G4

{ freq: 329.63, dur: 0.25 }, // E4

{ freq: 261.63, dur: 0.5 } // C4

];

let t = audioCtx.currentTime;

melody.forEach(n => {

playTone(n.freq, n.dur, t);

t += n.dur;

});

}

function finishTimer(){

// если мелодия ещё не сыграна, сыграем

if (!melodyScheduled){

melodyScheduled = true;

playMelody();

} else {

// сбросим флаг для повторных запусков

melodyScheduled = false;

}

}

document.getElementById('startBtn').addEventListener('click', () => {

const mins = parseInt(document.getElementById('minutes').value, 10);

const secs = parseInt(document.getElementById('seconds').value, 10);

if (isNaN(mins) || mins < 0 || isNaN(secs) || secs < 0 || secs > 59) return;

totalSeconds = mins * 60 + secs;

updateDisplay(totalSeconds);

if (timerId) clearInterval(timerId);

timerId = setInterval(() => {

if (totalSeconds <= 0){

clearInterval(timerId);

timerId = null;

isRunning = false;

document.getElementById('startBtn').disabled = false;

document.getElementById('pauseBtn').disabled = true;

document.getElementById('resetBtn').disabled = false;

finishTimer();

return;

}

totalSeconds--;

updateDisplay(totalSeconds);

}, 1000);

isRunning = true;

document.getElementById('startBtn').disabled = true;

document.getElementById('pauseBtn').disabled = false;

document.getElementById('resetBtn').disabled = false;

});

document.getElementById('pauseBtn').addEventListener('click', () => {

if (timerId){

clearInterval(timerId);

timerId = null;

isRunning = false;

document.getElementById('startBtn').disabled = false;

document.getElementById('pauseBtn').disabled = true;

}

});

document.getElementById('resetBtn').addEventListener('click', () => {

if (timerId) clearInterval(timerId);

timerId = null;

isRunning = false;

totalSeconds = 0;

const mins = parseInt(document.getElementById('minutes').value, 10) || 0;

const secs = parseInt(document.getElementById('seconds').value, 10) || 0;

totalSeconds = mins * 60 + secs;

updateDisplay(totalSeconds);

document.getElementById('startBtn').disabled = false;

document.getElementById('pauseBtn').disabled = true;

document.getElementById('resetBtn').disabled = true;

});

// Инициализация дисплея

updateDisplay(parseInt(document.getElementById('minutes').value, 10) * 60 +

parseInt(document.getElementById('seconds').value, 10));

</script>

</body>

</html>
